name: Audit issue readiness invariants

on:
  issues:
    types: [closed, edited]
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: issue-readiness-invariant-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Enforce readiness after issue events
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          MODE: ${{ github.event.action }}
        run: docs/agents/scripts/audit-issue-readiness.sh "$MODE"

      - name: Sweep ready issues for invariant violations
        if: github.event_name != 'issues'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: docs/agents/scripts/audit-issue-readiness.sh audit
