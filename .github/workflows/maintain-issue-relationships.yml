name: Audit issue readiness invariants

on:
  issues:
    types: [closed]
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: issue-readiness-invariant-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Remove readiness from the closed issue
        if: github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'ready-for-agent')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          echo "#$ISSUE_NUMBER is closed; removing ready-for-agent"
          gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --remove-label ready-for-agent

      - name: Sweep ready issues for invariant violations
        if: github.event_name != 'issues'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          NAME="${REPO#*/}"

          gh issue list --repo "$REPO" --state all --label ready-for-agent \
            --limit 1000 --json number,state \
            --jq '.[] | "\(.number) \(.state)"' \
            | while read -r NUMBER STATE; do
                if [ "$STATE" = "CLOSED" ]; then
                  echo "#$NUMBER is closed; removing ready-for-agent"
                  gh issue edit "$NUMBER" --repo "$REPO" --remove-label ready-for-agent
                  continue
                fi

                # GraphQL variables intentionally remain outside the quoted query.
                # shellcheck disable=SC2016
                DATA=$(gh api graphql \
                  -f owner="$OWNER" -f name="$NAME" -F number="$NUMBER" \
                  -f query='
                    query($owner: String!, $name: String!, $number: Int!) {
                      repository(owner: $owner, name: $name) {
                        issue(number: $number) {
                          blockedBy(first: 100) {
                            nodes { number state }
                          }
                        }
                      }
                    }')

                OPEN_BLOCKERS=$(echo "$DATA" \
                  | jq '[.data.repository.issue.blockedBy.nodes[] | select(.state == "OPEN")] | length')
                if [ "$OPEN_BLOCKERS" -eq 0 ]; then
                  continue
                fi

                BLOCKER_NUMBERS=$(echo "$DATA" \
                  | jq -r '[.data.repository.issue.blockedBy.nodes[] | select(.state == "OPEN") | ("#" + (.number | tostring))] | join(", ")')
                echo "#$NUMBER has open blocker(s) $BLOCKER_NUMBERS; removing ready-for-agent"
                gh issue edit "$NUMBER" --repo "$REPO" --remove-label ready-for-agent
              done

          echo "Audit complete. Native relationships were retained; no issue was promoted."
