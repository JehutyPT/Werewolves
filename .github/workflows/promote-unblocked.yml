name: Promote unblocked issues

on:
  issues:
    types: [closed]
  workflow_dispatch:

jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Promote blocked issues whose blockers have all closed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          gh issue list --repo "$REPO" --label blocked --state open --limit 200 \
            --json number,body --jq '.[]' \
          | while read -r issue; do
              NUM=$(echo "$issue" | jq -r '.number')
              BODY=$(echo "$issue" | jq -r '.body')

              BLOCKERS=$(echo "$BODY" | awk '
                /^## Blocked by/ { flag=1; next }
                /^## / { flag=0 }
                flag { print }
              ' | grep -oE '#[0-9]+' | tr -d '#' | sort -u)

              if [ -z "$BLOCKERS" ]; then
                echo "#$NUM: labeled blocked but no '## Blocked by' references — skipping"
                continue
              fi

              ALL_CLOSED=true
              for B in $BLOCKERS; do
                STATE=$(gh issue view "$B" --repo "$REPO" --json state --jq '.state' 2>/dev/null || echo "MISSING")
                if [ "$STATE" != "CLOSED" ]; then
                  ALL_CLOSED=false
                  echo "#$NUM: blocker #$B is $STATE — not promoting"
                  break
                fi
              done

              if [ "$ALL_CLOSED" = true ]; then
                echo "#$NUM: all blockers closed — promoting to ready-for-agent"
                gh issue edit "$NUM" --repo "$REPO" \
                  --remove-label blocked --add-label ready-for-agent
              fi
            done
